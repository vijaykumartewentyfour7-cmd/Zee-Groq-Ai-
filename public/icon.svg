<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="190" stroke="url(#glow)" stroke-width="3" stroke-dasharray="16 12" fill="none" opacity="0.4" />
  
  <!-- Outer glowing orbital ring -->
  <circle cx="256" cy="256" r="150" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.2" />

  <!-- Z stylized logo -->
  <g filter="url(#neon)">
    <path d="M 160 160 L 352 160 L 220 352 L 352 352" 
          stroke="url(#glow)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    <!-- Center quantum core -->
    <circle cx="286" cy="256" r="14" fill="#06b6d4" />
    <!-- Grok spark -->
    <path d="M 330 190 L 340 160 L 370 150 L 340 140 L 330 110 L 320 140 L 290 150 L 320 160 Z" fill="url(#spark)" />
  </g>
</svg>
